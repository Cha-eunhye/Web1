<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브댓글실습</title>
    <script src="https://kit.fontawesome.com/c20f4000ab.js" crossorigin="anonymous"></script>

    <style>
        .comment_container {
            display: flex;
            justify-content: space-between;
            margin: 16px;
            max-width:1200px;
        }

        figure {
            background: url(./프로필아이콘.png);
            width: 40px;
            height: 40px;
            margin: 0;
            background-size: contain;
            background-repeat: no-repeat;
        }

        figure > a {
            width: 40px;
            height: 40px;
            display: block;
        }

        .user_comment {
            flex-basis: 93%;
        }

        .user_name, 
        .user_comment {
            font-size: 14px;
        }

        .icon_box {
            display: flex;
            align-items: center;
        }

        .icon_box > div {
            margin-right: 20px;
        }

        .recomment {
            color: #065fd4;
            width: 100px;
            height: 70px;
            text-align: left;
            line-height: 70px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="comment_container">
        <figure>
            <a href="#"></a>
        </figure>
        <div class="user_comment">
            <h2 class="user_name">@의리왕킹보성</h2>
            <p class="comment_content">
                기르는 입장에선 강아지들은 뭘해도 용서가되고 <br> 
                강아지들 입장에선 주인이 뭘해도 충성을 다하니 사랑할수 밖에 없는 동물이죠
                <br>
                그래서 이별하는 순간이 더 가슴 아픈것 같구요
            </p>
            <div class="icon_box">
               <div>
                     <i class="fa-solid fa-thumbs-up">482</i> 
               </div>
               <div>
                     <i class="fa-solid fa-thumbs-down"></i>
               </div>
               <p>Reply</p>
            </div>

            <div class="recomment">
                <i class="fa-solid fa-chevron-down"></i>
                <span>1 replay</span>
            </div>
            
        </div>
        <div>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </div>
</body>
</html>
